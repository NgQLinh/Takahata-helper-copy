version: '3.8'

services:

  auth-db:
    image: mysql
    container_name: TAKAHATA_MySQL_Contanier
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=TAKAHATA_DB
    volumes:
      - D:\Volumes\TAKAHATA_MySQL:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: TAKAHATA_InfluxDB2_Container
    restart: always
    ports:
      - "8086:8086"
    volumes:
      - D:\Volumes\TAKAHATA_InfluxDB2\data:/var/lib/influxdb2
      - D:\Volumes\TAKAHATA_InfluxDB2\config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: 12345678
      DOCKER_INFLUXDB_INIT_ORG: TAKAHATA
      DOCKER_INFLUXDB_INIT_BUCKET: cnc-realtime
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: lRUzzeNDrNuVvXIlZk38p0Aw7bKvMB7r
    networks:
      - mssql_network

networks:
  mssql_network:
    driver: bridge
